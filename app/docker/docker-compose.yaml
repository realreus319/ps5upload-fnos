# fnOS supplies wizard answers directly when creating the project.
services:
  ps5upload:
    image: ghcr.io/phantomptr/ps5upload-engine-webui:latest
    container_name: ps5upload-fnos
    network_mode: host
    restart: unless-stopped
    user: "${TRIM_UID:-65532}:${TRIM_GID:-65532}"
    environment:
      PS5_ADDR: "${wizard_ps5_addr:-}"
      PS5UPLOAD_ALLOW_IP: "0.0.0.0/0"
      PS5UPLOAD_BROWSE_ROOTS: /pkgs
      PS5UPLOAD_STAGING_DIR: /staging-root/ps5upload-staging
    volumes:
      - type: bind
        source: "${wizard_game_path:-${TRIM_DATA_SHARE_PATHS:-/var/apps/ps5upload/share/PS5Upload}}"
        target: /pkgs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${wizard_staging_path:-${TRIM_PKGVAR:-/var/apps/ps5upload/var}}"
        target: /staging-root
        bind:
          create_host_path: false
      - ps5upload-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ps5upload-data:
    name: ps5upload-fnos_ps5upload-data
