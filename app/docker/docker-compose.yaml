services:
  ps5upload:
    image: ghcr.io/phantomptr/ps5upload-engine-webui:latest
    container_name: ps5upload-fnos
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${TRIM_UID:-65532}:${TRIM_GID:-65532}"
    environment:
      PS5UPLOAD_ALLOW_IP: "${wizard_allow_ip:-192.168.1.0/24}"
      PS5UPLOAD_BROWSE_ROOTS: /pkgs
    volumes:
      - "${wizard_game_path:-${TRIM_PKGVAR}/library}:/pkgs:ro"
      - ps5upload-data:/data
volumes:
  ps5upload-data:
