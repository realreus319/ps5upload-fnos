# fnOS supplies wizard answers directly when creating the project.
services:
  ps5upload:
    image: ghcr.io/phantomptr/ps5upload-engine-webui:latest
    container_name: ps5upload-fnos
    network_mode: host
    init: true
    entrypoint: ["/fnos-gateway", "--supervise", "/gateway/app.sock", "127.0.0.1:19113", "/ps5upload-engine"]
    stop_grace_period: 15s
    restart: unless-stopped
    # Only the signal/identity supervisor starts as root; both serving children drop privileges.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FNOS_PACKAGE_UID: "${TRIM_UID:-65532}"
      FNOS_PACKAGE_GID: "${TRIM_GID:-65532}"
      FNOS_ENGINE_UID: "${wizard_puid:-}"
      FNOS_ENGINE_GID: "${wizard_pgid:-}"
      FNOS_CUSTOM_DATA: "${wizard_data_path:-}"
      PS5_ADDR: "${wizard_ps5_addr:-}"
      PS5UPLOAD_ALLOW_IP: "0.0.0.0/0"
      PS5UPLOAD_BASE_URL: /app/ps5upload/
      PS5UPLOAD_BROWSE_ROOTS: /pkgs
      PS5UPLOAD_STAGING_DIR: /staging-root/ps5upload-staging
    volumes:
      - type: bind
        source: "${TRIM_APPDEST:-/var/apps/ps5upload/target}/bin/gateway-rust"
        target: /fnos-gateway
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TRIM_APPDEST:-/var/apps/ps5upload/target}"
        target: /gateway
        bind:
          create_host_path: false
      - type: bind
        source: "${wizard_game_path:-${TRIM_DATA_SHARE_PATHS:-/var/apps/ps5upload/share/PS5Upload}}"
        target: /pkgs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${wizard_staging_path:-${wizard_data_path:-${TRIM_PKGVAR:-/var/apps/ps5upload/var}}}"
        target: /staging-root
        bind:
          create_host_path: false
      - type: bind
        source: "${wizard_data_path:-${TRIM_PKGVAR:-/var/apps/ps5upload/var}}"
        target: /data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
