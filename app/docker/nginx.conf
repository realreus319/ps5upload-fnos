# fnOS gateway authenticates the desktop session and forwards it over this socket.
# Keep the official engine's SAMEORIGIN and CSP response headers intact.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_host $external_host {
    default $http_x_forwarded_host;
    '' $http_host;
}
map $http_x_forwarded_proto $external_proto {
    default $http_x_forwarded_proto;
    '' http;
}
map $http_x_trim_isadmin $is_admin {
    default 0;
    true 1;
    1 1;
}
server {
    listen unix:/gateway/app.sock;
    server_name _;
    absolute_redirect off;
    client_max_body_size 0;
    if ($is_admin = 0) { return 403; }
    location = /app/ps5upload {
        return 302 /app/ps5upload/;
    }
    location /app/ps5upload/ {
        proxy_pass http://127.0.0.1:19113;
        proxy_http_version 1.1;
        proxy_set_header Host $external_host;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { return 404; }
}
