name: Review FPK and real container
on:
  push:
    branches: [review/native-directory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate package sources
        run: |
          set -euo pipefail
          for f in cmd/* build.sh; do bash -n "$f"; done
          for f in config/* wizard/* app/ui/config; do python3 -m json.tool "$f" >/dev/null; done
          python3 -c 'import json; assert json.load(open("config/privilege"))["defaults"]["run-as"] == "package"'
      - name: Exercise real engine and storage
        run: bash tests/smoke.sh
      - name: Install official packager
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          curl -fL --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /tmp/fnpack
          sudo install -m 755 /tmp/fnpack /usr/local/bin/fnpack
      - name: Build with official fnpack
        run: |
          bash build.sh
          test -s ps5upload.fpk
          sha256sum ps5upload.fpk
      - uses: actions/upload-artifact@v4
        with:
          name: PS5Upload-review-only
          path: ps5upload.fpk
          if-no-files-found: error
