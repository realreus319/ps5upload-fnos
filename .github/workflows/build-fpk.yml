name: Build and release FPK
on:
  push:
    branches: [main, review/custom-data, review/path-validation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate package sources
        run: |
          set -euo pipefail
          for f in cmd/* build.sh; do bash -n "$f"; done
          for f in config/* wizard/* app/ui/config; do python3 -m json.tool "$f" >/dev/null; done
          python3 -c 'import json; assert json.load(open("config/privilege"))["defaults"]["run-as"] == "package"'
      - name: Validate directory inputs
        run: bash tests/validate-paths.sh
      - name: Exercise real engine and storage
        run: bash tests/smoke.sh
      - name: Install official packager
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          curl -fL --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /tmp/fnpack
          sudo install -m 755 /tmp/fnpack /usr/local/bin/fnpack
      - name: Build with official fnpack
        run: |
          bash build.sh
          test -s ps5upload.fpk
          sha256sum ps5upload.fpk
      - uses: actions/upload-artifact@v4
        with:
          name: PS5Upload-fnos
          path: ps5upload.fpk
          if-no-files-found: error
      - name: Publish tested FPK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' manifest)
          tag="v$version"
          mkdir -p /tmp/release
          cp ps5upload.fpk "/tmp/release/PS5Upload-fnos-$version.fpk"
          cd /tmp/release
          sha256sum *.fpk > SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" *.fpk SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" *.fpk SHA256SUMS.txt --target "$GITHUB_SHA" --title "PS5Upload fnOS $version" --notes "Official fnpack packaging and real Docker smoke tests passed. fnOS device installation, permissions and configuration changes still require device verification. Paths are entered as text. IPv4 access is unrestricted: trusted network only." --repo "$GITHUB_REPOSITORY"
          fi
